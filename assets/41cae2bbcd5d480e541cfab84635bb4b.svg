="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">we kiddy we kiddy</tspan></text><text transform="translate(274.43589,81.26035) scale(0.35139,0.35139)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">As stated in the gallery</tspan><tspan x="0" dy="46.150000000000006px">this is an INCREDIBOX MOD</tspan><tspan x="0" dy="46.150000000000006px">so please if you have some</tspan><tspan x="0" dy="46.150000000000006px">cash or find a not so moral</tspan><tspan x="0" dy="46.150000000000006px">way of getting it PLAY </tspan><tspan x="0" dy="46.150000000000006px">INCREDIBOX!! its a fun little</tspan><tspan x="0" dy="46.150000000000006px">experience and if you find it</tspan><tspan x="0" dy="46.150000000000006px">boring there are still a ton</tspan><tspan x="0" dy="46.150000000000006px">of other mods to play out</tspan><tspan x="0" dy="46.150000000000006px">there!</tspan></text><text transform="translate(384.7713,298.4173) scale(0.35139,0.35139)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">click to next</tspan></text></g></g></svg>